# Запуск всего решения одной командой:
#
#   docker compose up --build
#
# Поднимается одна программа: чат-бот MAX (если в .env задан BOT_TOKEN) и HTTP API
# на http://127.0.0.1:8080. Остановить — Ctrl+C или docker compose down.
services:
  app:
    build: .
    image: maxexport:local
    container_name: maxexport
    # Настройки берутся из .env (создайте его из .env.example). Без файла тоже запустится:
    # тогда работает только API, а бот MAX ждёт токен.
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    # Служебный API доступен только с самой машины: наружу торчит лишний порт ни к чему,
    # бот сам ходит в MAX (long polling). Чтобы открыть API в сеть, замените на "8080:8080".
    ports:
      - "127.0.0.1:8080:8080"
    # Контейнер поднимается сам после перезагрузки сервера и после сбоя.
    restart: unless-stopped
    # Журналы не съедают диск сервера.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
